[workspace]
resolver = "2"
members = ["crates/core", "crates/activity", "crates/providers", "crates/ui", "crates/app", "crates/installer"]

[workspace.package]
edition = "2021"
version = "0.2.4"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
windows = "0.58"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

