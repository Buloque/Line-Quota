[package]
name = "line-quota-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Instalador do Line Quota"

[[bin]]
name = "LineQuota-Setup"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Graphics_Dwm",
] }

[build-dependencies]
winresource.workspace = true
